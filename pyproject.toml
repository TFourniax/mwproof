[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmw"
version = "0.6.0"
description = "Evidence-first AI infrastructure underwriting research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.116", "uvicorn>=0.35", "pydantic>=2.11"]
dev = ["pytest>=8.0", "httpx>=0.28"]

[project.scripts]
proofmw = "proofmw.cli:main"

[tool.setuptools]
package-dir = {"" = "src"]

[tool.setuptools.packages.find]
where = ["src"]
