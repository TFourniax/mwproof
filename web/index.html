<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProofMW V0.1</title>
<style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0b0f14;color:#e7edf5}.wrap{max-width:1100px;margin:auto;padding:40px 20px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.muted{color:#91a0b5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{background:#121923;border:1px solid #243041;border-radius:14px;padding:18px}.big{font-size:30px;font-weight:700}.warn{color:#ffcc66}.bar{height:9px;background:#233044;border-radius:99px;overflow:hidden}.fill{height:100%;background:#8fb3ff}.rows{display:grid;gap:10px}select{background:#121923;color:#fff;border:1px solid #324157;border-radius:8px;padding:8px}</style></head>
<body><div class="wrap"><div class="hero"><div><div class="muted">ProofMW V0.1</div><h1>From promised megawatts to bankable compute.</h1><p class="muted">Evidence-backed probabilistic underwriting demo · Start Campus SIN02 public-information case.</p></div><select id="date"></select></div>
<p class="warn">DEMO ONLY — public facts + explicitly synthetic uncertainty assumptions. Not a credit opinion.</p><div id="metrics" class="grid"></div><h2>Critical path frequency</h2><div id="critical" class="rows"></div><h2>Delivery confidence</h2><div id="cod" class="grid"></div></div>
<script>
fetch('../fixtures/start-campus-sin02-public/demo-output.json').then(r=>r.json()).then(d=>{const sel=document.querySelector('#date');Object.keys(d.results).forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;sel.appendChild(o)});function render(){let r=d.results[sel.value], q=r.capacity;document.querySelector('#metrics').innerHTML=Object.entries(q).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="big">${v.toFixed(1)} MW</div></div>`).join('')+`<div class="card"><div class="muted">Expected</div><div class="big">${r.expected_mw.toFixed(1)} MW</div></div><div class="card"><div class="muted">P(any power)</div><div class="big">${(100*r.probability_any_power).toFixed(1)}%</div></div>`;document.querySelector('#critical').innerHTML=r.critical_path_frequency.map(x=>`<div class="card"><b>${x.gate_id}</b> ${(100*x.frequency).toFixed(1)}%<div class="bar"><div class="fill" style="width:${100*x.frequency}%"></div></div></div>`).join('')}sel.onchange=render;sel.value=Object.keys(d.results).slice(-1)[0];render();document.querySelector('#cod').innerHTML=Object.entries(d.delivery_date).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><div class="big" style="font-size:22px">${v}</div></div>`).join('')})
</script></body></html>
