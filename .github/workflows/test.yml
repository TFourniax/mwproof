name: test

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run core tests
        run: python -m pytest -q
      - name: Exercise public demo guardrail
        run: PYTHONPATH=src python -m proofmw.cli grade fixtures/start-campus-sin02-public/project.json
      - name: Validate public evidence graph and V0.3 research workflows
        run: |
          PYTHONPATH=src python -m proofmw.cli ledger-summary data/europe-public-events-v2
          PYTHONPATH=src python -m proofmw.cli ledger-conflicts data/europe-public-events-v2
          PYTHONPATH=src python -m proofmw.cli data-quality data/europe-public-events-v2
          PYTHONPATH=src python -m proofmw.cli calibration-readiness data/europe-public-events-v2
          PYTHONPATH=src python -m proofmw.cli permitting-summary data/europe-public-events-v2
          PYTHONPATH=src python -m proofmw.cli backtest data/europe-public-events-v2 --milestone-type operations
          PYTHONPATH=src python -m proofmw.cli calibration data/europe-public-events-v2 --milestone-type operations --min-history 3
          PYTHONPATH=src python -m proofmw.cli research-priorities data/europe-public-events-v2
          PYTHONPATH=src python -m proofmw.cli project-dossier data/europe-public-events-v2 start-campus-sines --as-of 2026-08-18
