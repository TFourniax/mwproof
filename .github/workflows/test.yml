name: test

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Run core tests
        run: python -m pytest -q
      - name: Exercise public demo guardrail
        run: PYTHONPATH=src python -m proofmw.cli grade fixtures/start-campus-sin02-public/project.json
      - name: Validate public evidence graph
        run: |
          PYTHONPATH=src python -m proofmw.cli ledger-summary data/europe-public-events-v1.json
          PYTHONPATH=src python -m proofmw.cli ledger-conflicts data/europe-public-events-v1.json
          PYTHONPATH=src python -m proofmw.cli data-quality data/europe-public-events-v1.json
          PYTHONPATH=src python -m proofmw.cli permitting-summary data/europe-public-events-v1.json
          PYTHONPATH=src python -m proofmw.cli backtest data/europe-public-events-v1.json --milestone-type operations
